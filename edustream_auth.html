<body class="bg-background min-h-screen flex flex-col">
<!-- Top Branding Header (Non-Navigation Shell for Transactional Flow) -->
<header class="w-full py-md px-8 flex justify-center">
<a class="text-primary-container font-display text-[28px] tracking-tighter" href="/edustream.html">
            EduStream
</a>
</header>
<!-- Main Content: Sign Up Canvas -->
<main class="flex-grow flex items-center justify-center px-4 py-lg">
<div class="bg-surface-container-lowest w-full max-w-[480px] p-8 lg:p-md shadow-[0px_2px_20px_rgba(0,0,0,0.08)] rounded-lg">
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs" id="auth-title">Join EduStream</h1>
<p class="font-body-md text-body-md text-on-surface-variant" id="auth-subtitle">Elevate your expertise with world-class instruction.</p>
</div>
<!-- Social Sign Up -->
<div class="space-y-sm mb-lg">
<button class="w-full h-[48px] flex items-center justify-center gap-sm border-2 border-outline text-on-surface font-label-md hover:bg-surface-variant transition-all duration-200 active:scale-[0.98]">
<img alt="" class="w-5 h-5" data-alt="A sharp, minimalist Google logo centered on a clean white background, representing professional digital integration. The image is captured in bright, high-key studio lighting that emphasizes clarity and modern tech aesthetics, perfectly aligning with a corporate-modern design language." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-EnTLC1a3QahnH30PYY8aVu1DzM5WcJ6705Sadk_d98DdWdL2cXUBTbeiAOIVhMRmHn0q3pFHALqEpGjP9QhtW9uhGHTtK-_eQn34qO-Wn7OU-hbXICoOuaUMAUIJa51eP1QAv0nkD_y7XgsuWmrbxUg8R8bamovKkowX1_pO6096E7rEr8sUAfNL5qt1jlPvDWFfKfJ_kHWiTpEtYT3KhreoeaDptq4LV6gyCJW-kxZndMibm-BwdUKD_Jkb6_9ohFkpSVQj7N_A"/>
<span>Continue with Google</span>
</button>
<button class="w-full h-[48px] flex items-center justify-center gap-sm border-2 border-outline text-on-surface font-label-md hover:bg-surface-variant transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface" data-icon="facebook" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span>Continue with Facebook</span>
</button>
</div>
<div class="relative flex items-center justify-center mb-lg">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant"></span>
</div>
<span class="relative bg-surface-container-lowest px-4 text-label-sm text-on-surface-variant uppercase tracking-wider" id="auth-divider-text">or sign up with email</span>
</div>
<!-- Form -->
<form class="space-y-md" id="auth-form">
<div class="space-y-xs" id="name-container">
<label class="font-label-md text-label-md text-on-surface" for="full_name">Full Name</label>
<input class="w-full h-[48px] px-md border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline bg-transparent" id="full_name" name="full_name" placeholder="Enter your full name" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full h-[48px] px-md border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline bg-transparent" id="email" name="email" placeholder="email@example.com" type="email"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<input class="w-full h-[48px] px-md border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-outline bg-transparent" id="password" name="password" placeholder="At least 8 characters" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-sm" id="terms-container">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary-container border-outline-variant rounded-sm focus:ring-primary-container" id="terms" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary-container font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary-container font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<button class="w-full h-[48px] bg-primary-container text-on-primary-container font-label-md rounded-none hover:bg-primary transition-all duration-200 active:scale-95 shadow-md" type="submit" id="submit-btn">
                    Sign Up
                </button>
</form>
<div class="mt-lg pt-md border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant" id="auth-switch-text">
                    Already have an account?
                    <a class="text-primary-container font-bold hover:underline ml-xs cursor-pointer" id="auth-switch-link" onclick="switchMode('login')">Log In</a>
</p>
</div>
</div>

                EduStream
            </div>

<a class="font-['Inter'] text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-purple-700 dark:hover:text-purple-300 transition-colors opacity-100 hover:opacity-80" href="#">Terms of Service</a>
<a class="font-['Inter'] text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-purple-700 dark:hover:text-purple-300 transition-colors opacity-100 hover:opacity-80" href="#">Privacy Policy</a>

</div>

                © 2024 EduStream, Inc. All rights reserved.
            </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>

<script>
    // ── Firebase init ──────────────────────────────────────────
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    auth.onAuthStateChanged(function(user) {
      if (user) window.location.href = '/dashboard';
    });

    let mode = 'register';

    // Auto-detect mode from URL
    (function() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('mode') === 'login') switchMode('login');
      else switchMode('register');
    })();

    // ── Google Sign-In ─────────────────────────────────────────
    async function signWithGoogle() {
      clearMsgs();
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        window.location.href = '/dashboard';
      } catch(err) {
        if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
          showErr(mapError(err.code));
        }
      }
    }

    // ── Email/Password ─────────────────────────────────────────
    async function handleSubmit(e) {
      e.preventDefault();
      clearMsgs();

      const name  = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pw    = document.getElementById('password').value;
      let valid = true;

      if (mode === 'register' && !name) {
        valid = false;
        showErr("Please enter your name");
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        valid = false;
        showErr("Enter a valid email address");
      }
      if (!pw || pw.length < 6) {
        valid = false;
        showErr("Password must be at least 6 characters");
      }
      if (!valid) return;

      const subBtn = document.getElementById('submit-btn');
      subBtn.disabled = true;
      subBtn.style.opacity = '0.7';

      try {
        if (mode === 'register') {
          const uc = await auth.createUserWithEmailAndPassword(email, pw);
          await uc.user.updateProfile({ displayName: name });
        } else {
          await auth.signInWithEmailAndPassword(email, pw);
        }
        window.location.href = '/dashboard';
      } catch(err) {
        showErr(mapError(err.code));
        subBtn.disabled = false;
        subBtn.style.opacity = '1';
      }
    }

    // ── Helpers ────────────────────────────────────────────────
    function switchMode(m) {
      mode = m;
      clearMsgs();
      const reg = m === 'register';

      const nameContainer = document.getElementById('name-container');
      if (nameContainer) nameContainer.style.display = reg ? 'block' : 'none';

      const termsContainer = document.getElementById('terms-container');
      if (termsContainer) termsContainer.style.display = reg ? 'flex' : 'none';

      document.getElementById('auth-title').textContent = reg ? 'Join EduStream' : 'Welcome back';
      document.getElementById('auth-subtitle').textContent = reg ? 'Elevate your expertise with world-class instruction.' : 'Log in to continue learning.';
      document.getElementById('auth-divider-text').textContent = reg ? 'or sign up with email' : 'or log in with email';

      document.getElementById('submit-btn').textContent = reg ? 'Sign Up' : 'Log In';

      const pwInput = document.getElementById('password');
      pwInput.autocomplete = reg ? 'new-password' : 'current-password';
      pwInput.placeholder = reg ? 'At least 8 characters' : 'Enter your password';

      const switchText = document.getElementById('auth-switch-text');
      if (reg) {
        switchText.innerHTML = 'Already have an account? <a class="text-primary-container font-bold hover:underline ml-xs cursor-pointer" onclick="switchMode(\'login\')">Log In</a>';
      } else {
        switchText.innerHTML = 'Don\'t have an account? <a class="text-primary-container font-bold hover:underline ml-xs cursor-pointer" onclick="switchMode(\'register\')">Sign Up</a>';
      }
    }

    function clearMsgs() {
      let errBox = document.getElementById('global-err');
      if (errBox) {
        errBox.style.display = 'none';
        errBox.textContent = '';
      }
    }

    function showErr(msg) {
      let errBox = document.getElementById('global-err');
      if (!errBox) {
        errBox = document.createElement('div');
        errBox.id = 'global-err';
        errBox.className = 'w-full p-3 mb-4 text-sm text-error bg-error-container rounded-md border border-error/20';
        const form = document.querySelector('form');
        form.parentNode.insertBefore(errBox, form);
      }
      errBox.textContent = msg;
      errBox.style.display = 'block';
    }

    function mapError(code) {
      return ({
        'auth/email-already-in-use'  : 'This email is already registered. Try signing in.',
        'auth/user-not-found'        : 'No account found with this email.',
        'auth/wrong-password'        : 'Incorrect password. Try again.',
        'auth/invalid-credential'    : 'Invalid email or password. Try again.',
        'auth/invalid-email'         : 'Please enter a valid email address.',
        'auth/weak-password'         : 'Password must be at least 6 characters.',
        'auth/too-many-requests'     : 'Too many attempts. Try again later.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/operation-not-allowed' : 'This sign-in method is disabled in Firebase Console.',
        'auth/unauthorized-domain'   : 'This domain (gyansetu-ubna.onrender.com) is not authorized in your Firebase Console for OAuth (Google/Facebook). Please add it under Authentication -> Settings -> Authorized domains.',
      })[code] || `Error: ${code || 'Unknown error'}. Please try again.`;
    }

    // Attach event listeners
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('form').addEventListener('submit', handleSubmit);

      // Wire up Google button
      const googleBtn = document.querySelector('button:has(img)');
      if (googleBtn) {
        googleBtn.type = 'button';
        googleBtn.addEventListener('click', signWithGoogle);
      }

      // Password toggle
      const pwToggle = document.querySelector('button:has(.material-symbols-outlined[data-icon="visibility"])');
      if (pwToggle) {
        pwToggle.addEventListener('click', function() {
          const pwInput = document.getElementById('password');
          const icon = this.querySelector('.material-symbols-outlined');
          if (pwInput.type === 'password') {
            pwInput.type = 'text';
            icon.textContent = 'visibility_off';
          } else {
            pwInput.type = 'password';
            icon.textContent = 'visibility';
          }
        });
      }
    });
</script>
</body>
</html>
